{{- if .Values.flux.enabled }}
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: {{ .Release.Name }}
spec:
  image: {{ .Values.image }}
  interval: 5m
  secretRef:
    name: {{ .Values.imagePullSecret.name }}
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: {{ .Release.Name }}
spec:
  imageRepositoryRef:
    name: {{ .Release.Name }}
  filterTags:
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
  policy:
    semver:
      range: '>=0.24.0 <0.25.0'
{{- end }}
