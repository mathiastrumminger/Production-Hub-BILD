<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production Hub</title>
<style>
:root{
  --bg:#0e1014;--panel:#161920;--panel2:#1d212a;--panel3:#252a35;--line:#2b303c;
  --text:#e8eaef;--muted:#9299a8;--accent:#e30613;--accent2:#ff3743;
  --ok:#22c55e;--warn:#eab308;--bad:#ef4444;--new:#f59e0b;--r:10px;
  --hour:46px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.hidden{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{display:flex;height:100vh}
.sidebar{width:228px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px;border-bottom:1px solid var(--line)}
.brand small{display:block;color:var(--muted);font-size:11px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-weight:800;letter-spacing:-.5px}
nav{padding:10px 8px;flex:1;overflow:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:#cfd3dc;margin-bottom:2px;user-select:none}
.nav-item:hover{background:var(--panel2)}
.nav-item.active{background:var(--panel3);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav-item .ic{width:20px;text-align:center}
.nav-item .badge{margin-left:auto}
.nav-sep{height:1px;background:var(--line);margin:10px 6px}
.sidebar-foot{padding:12px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.content{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.topbar h1{font-size:18px;margin:0}
.top-right{display:flex;gap:10px;align-items:center}
.icon-btn{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:8px;width:38px;height:36px;cursor:pointer}
.icon-btn .dot{position:absolute;top:-6px;right:-6px;background:var(--new);color:#111;font-style:normal;font-size:11px;font-weight:700;border-radius:9px;padding:1px 6px}
.user-chip{display:flex;flex-direction:column;align-items:flex-end;cursor:pointer;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}
.user-chip em{font-style:normal;font-size:11px;color:var(--muted)}
main{flex:1;overflow:auto;padding:18px 22px 40px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar .spacer{flex:1}
.tabs{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px}
.tab{padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab.active{background:var(--panel3);color:#fff}
.tab .badge{margin-left:6px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent2)}
.btn.danger{color:#fca5a5;border-color:#5b2323}
.btn.small{padding:4px 8px;font-size:12px}
.btn.ghost{background:transparent}
.btn.big{padding:12px 18px;font-size:15px}
.input,select.input,textarea.input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none;min-width:0}
.input:focus{border-color:#4b5563}
textarea.input{min-height:70px;resize:vertical;width:100%}
.datelabel{font-weight:600;min-width:170px;text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:12px;user-select:none}
.chip.off{opacity:.38}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;background:var(--panel3);color:var(--muted)}
.badge.new{background:var(--new);color:#1a1200}
.badge.ok{background:#14532d;color:#86efac}.badge.warn{background:#4d3b05;color:#fde68a}.badge.bad{background:#4c1414;color:#fca5a5}.badge.info{background:#1e3a5f;color:#93c5fd}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h3 .badge{margin-left:auto}
.list-row{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-top:1px solid var(--line);cursor:pointer}
.list-row:first-of-type{border-top:0}
.list-row:hover{background:var(--panel2)}
.list-row .time{color:var(--muted);font-variant-numeric:tabular-nums;width:92px;flex:none}
.list-row .sub{color:var(--muted);font-size:12px}
.list-row .acts{margin-left:auto;display:flex;gap:6px;flex:none}
.empty{color:var(--muted);padding:10px 4px;font-size:13px}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;min-width:150px;cursor:pointer}
.kpi b{font-size:24px;display:block}
.kpi span{color:var(--muted);font-size:12px}
.kpi.hot{border-color:var(--new)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table.t{border-collapse:collapse;width:100%;min-width:900px}
.t th{position:sticky;top:0;background:var(--panel2);text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr.row{cursor:pointer}
.t tr.row:hover td{background:var(--panel2)}
.t tr.is-new td:first-child{box-shadow:inset 4px 0 0 var(--new)}
.t tr.is-new td{background:rgba(245,158,11,.07)}
.t tr.past td{opacity:.55}
.t tr.cancel td{text-decoration:line-through;opacity:.6}
.t tr.cancel td.st{text-decoration:none;opacity:1}
.t td.st{width:26px;padding:0}
.t td.st div{width:100%;min-height:38px}
.t .muted,.muted{color:var(--muted)}
.hint-red{color:#f87171;font-weight:600}
.t tr.group td{background:var(--panel3);font-weight:700;cursor:default;padding:6px 10px}
.st-ok{background:var(--ok)}.st-warn{background:var(--warn)}.st-bad{background:var(--bad)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--panel3);margin:1px 2px 1px 0;white-space:nowrap}
.tg{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:auto;max-height:calc(100vh - 170px)}
.tg-head,.tg-allday,.tg-body{display:grid}
.tg-head{position:sticky;top:0;z-index:5;background:var(--panel2);border-bottom:1px solid var(--line)}
.tg-head div{padding:8px 10px;border-left:1px solid var(--line);font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-head div small{display:block;color:var(--muted);font-weight:400}
.tg-head div.today{color:var(--accent2);box-shadow:inset 0 -3px 0 var(--accent)}
.tg-head div i.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.tg-allday{border-bottom:2px solid var(--line);background:var(--panel)}
.tg-allday>div{border-left:1px solid var(--line);padding:3px;min-height:30px;display:flex;flex-direction:column;gap:3px}
.tg-allday .lbl,.tg-head .lbl{color:var(--muted);font-size:11px;padding:6px;border-left:0}
.tg-body{position:relative}
.tg-hours div{height:var(--hour);font-size:11px;color:var(--muted);text-align:right;padding:2px 6px 0 0;border-top:1px solid var(--line)}
.tg-col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent calc(var(--hour)/2));cursor:copy}
.tg-col.today{background-color:rgba(227,6,19,.035)}
.ev{position:absolute;border-radius:6px;padding:3px 6px;font-size:12px;overflow:hidden;cursor:pointer;border-left:3px solid rgba(0,0,0,.35);color:#111;line-height:1.25;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.ev b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev span{display:block;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.ev:hover{filter:brightness(1.08);z-index:4}
.ev.block{background:repeating-linear-gradient(45deg,#3a3f4b,#3a3f4b 6px,#2f333d 6px,#2f333d 12px)!important;color:#d4d7de;border-left-color:#8b8f99}
.ev.block.maint{background:repeating-linear-gradient(45deg,#4a3b1f,#4a3b1f 6px,#3b2f18 6px,#3b2f18 12px)!important;color:#fcd9a0;border-left-color:#f59e0b}
.ev.cancel{opacity:.45;text-decoration:line-through}
.ev.tentative{border-left-style:dashed;opacity:.85}
.ev.req{background:rgba(59,130,246,.14)!important;border:2px dashed #60a5fa;color:#bfdbfe;box-shadow:none}
.ev.is-new,.ad.is-new,.mchip.is-new{outline:2px solid var(--new);outline-offset:1px;animation:pulse 1.8s ease-in-out 3}
.ev .newtag,.mchip .newtag{position:absolute;top:2px;right:3px;background:var(--new);color:#1a1200;font-size:9px;font-weight:800;padding:0 4px;border-radius:4px}
@keyframes pulse{0%,100%{outline-color:var(--new)}50%{outline-color:transparent}}
.ad{border-radius:5px;padding:2px 6px;font-size:12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#111}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--accent2);z-index:3;pointer-events:none}
.nowline:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent2)}
.month{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.month .mh{background:var(--panel2);padding:7px 10px;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.mday{min-height:118px;border-left:1px solid var(--line);border-top:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.mday:nth-child(7n+1){border-left:0}
.mday.other{background:#121419;opacity:.6}
.mday .dn{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;cursor:pointer}
.mday.today .dn b{background:var(--accent);color:#fff;border-radius:10px;padding:0 6px}
.mday.hint{background:rgba(239,68,68,.07)}
.mchip{position:relative;font-size:11.5px;padding:2px 5px 2px 6px;border-radius:5px;background:var(--panel3);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--muted)}
.mchip.ok{border-left-color:var(--ok)}.mchip.warn{border-left-color:var(--warn)}.mchip.bad{border-left-color:var(--bad);text-decoration:line-through;opacity:.6}
.mchip.hintchip{background:rgba(239,68,68,.18);color:#fecaca;border-left-color:var(--bad);font-weight:600}
.matrix{display:grid;border:1px solid var(--line);border-radius:var(--r);overflow:auto;background:var(--panel)}
.matrix>div{border-left:1px solid var(--line);border-top:1px solid var(--line);padding:5px;min-height:46px}
.matrix .mhd{background:var(--panel2);font-weight:600;font-size:12px;border-top:0;position:sticky;top:0}
.matrix .mhd.today{color:var(--accent2)}
.matrix .who{border-left:0;font-size:13px}
.matrix .who small{display:block;color:var(--muted)}
.matrix .grp{grid-column:1/-1;background:var(--panel3);font-weight:700;font-size:12px;min-height:0;border-left:0}
.matrix .cell{cursor:copy;display:flex;flex-direction:column;gap:3px}
.achip{font-size:11.5px;border-radius:5px;padding:2px 6px;background:#2d3a52;cursor:pointer;line-height:1.3}
.achip.studio{background:#3b2f4f}
.achip.req{border:1px dashed #93c5fd}
.achip.is-new{outline:2px solid var(--new)}
.modal-layer{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow:auto}
#confirmLayer{z-index:60;align-items:center}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(820px,100%);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal.small{width:min(480px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0;font-size:16px;flex:1}
.modal-b{padding:16px 18px;max-height:68vh;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-f .left{margin-right:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .f{display:flex;flex-direction:column;gap:5px;min-width:0}
.form .f.wide{grid-column:1/-1}
.form label{font-size:12px;color:var(--muted)}
.form label .req{color:var(--accent2)}
.form .f.custom label:after{content:" · Zusatzfeld";color:#6b7280}
.form .f.changed .input,.form .f.changed .multi,.form .f.changed .tags{border-color:var(--new);box-shadow:0 0 0 1px var(--new)}
.form .f.changed label{color:var(--new)}
.multi{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.multi label{display:inline-flex;gap:5px;align-items:center;padding:3px 8px;border-radius:14px;background:var(--panel3);color:var(--text);font-size:12px;cursor:pointer}
.toggle{display:flex;align-items:center;gap:8px;padding:7px 0}
.meta{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.meta .hist{margin-top:6px}
.meta .hist div{padding:3px 0}
.warnbox{background:rgba(234,179,8,.1);border:1px solid #6b5208;color:#fde68a;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.warnbox ul{margin:4px 0 0 18px;padding:0}
.infobox{background:rgba(59,130,246,.08);border:1px solid #1e3a5f;color:#bfdbfe;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.okbox{background:rgba(34,197,94,.08);border:1px solid #14532d;color:#bbf7d0;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.bell-panel{position:fixed;top:52px;right:20px;width:400px;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;z-index:40;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.bell-panel .bh{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.bell-panel .bh b{flex:1}
.notif{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.notif:hover{background:var(--panel2)}
.notif.unread{box-shadow:inset 3px 0 0 var(--new)}
.notif small{color:var(--muted);display:block}
.notif .ch{color:#fcd34d;font-size:12px}
.toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:70}
.toast{background:var(--panel3);border:1px solid var(--line);border-left:4px solid var(--new);border-radius:10px;padding:10px 14px;max-width:360px;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:13px;cursor:pointer}
.toast.ok{border-left-color:var(--ok)}.toast.err{border-left-color:var(--bad)}
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#2a0b0e,var(--bg) 60%)}
.login-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:min(460px,92vw)}
.login-box h2{margin:10px 0 4px}
.login-box p{color:var(--muted);margin:0 0 18px}
.user-opt{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.user-opt:hover{border-color:var(--accent)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--panel3);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.user-opt small{display:block;color:var(--muted)}
.user-opt .badge{margin-left:auto}
.callsheet{background:#fff;color:#111;border-radius:var(--r);padding:26px 30px;max-width:900px}
.callsheet h2{margin:0;font-size:20px}
.callsheet .cs-sub{color:#555;margin-bottom:16px}
.callsheet h3{margin:18px 0 6px;font-size:15px;border-bottom:2px solid #e30613;padding-bottom:4px}
.callsheet table{width:100%;border-collapse:collapse;font-size:13px}
.callsheet td,.callsheet th{padding:5px 8px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}
.callsheet th{background:#f3f4f6;font-size:12px}
.callsheet .tm{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600;width:120px}
.side-split{display:grid;grid-template-columns:1fr 320px;gap:14px}
@media(max-width:1100px){.side-split{grid-template-columns:1fr}}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.color-input{width:44px;height:32px;border:1px solid var(--line);border-radius:6px;background:none;padding:0;cursor:pointer}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);min-height:36px;cursor:text}
.tagchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel3);border-radius:14px;padding:3px 6px 3px 10px;font-size:12.5px}
.tagchip b{cursor:pointer;color:var(--muted);font-weight:400;padding:0 3px}
.tagchip b:hover{color:#fff}
.tag-in{flex:1;min-width:140px;background:transparent;border:0;outline:none;padding:3px}
.repeat{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.wdays{display:inline-flex;gap:4px}
.wdays label{display:inline-flex;align-items:center;gap:3px;padding:4px 8px;border-radius:14px;background:var(--panel3);font-size:12px;color:var(--text);cursor:pointer}
.rep-until{display:inline-flex;gap:6px;align-items:center}
/* v0.5 Verfügbarkeit */
.strips{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.strip-row{display:grid;grid-template-columns:170px 1fr 92px;gap:12px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.strip-row:first-child{border-top:0}
.strip-row.head{background:var(--panel2);padding:6px 12px}
.strip-row.today .strip-lbl b{color:var(--accent2)}
.strip-row.past{opacity:.45}
.strip-lbl small{display:block;color:var(--muted);font-size:11.5px}
.strip-lbl i.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.strip{position:relative;height:34px;border-radius:7px;background:rgba(34,197,94,.22);border:1px solid rgba(34,197,94,.45);cursor:pointer;overflow:hidden}
.strip:hover{border-color:#86efac}
.strip.closed{background:var(--panel2);border-color:var(--line);cursor:not-allowed}
.strip .seg{position:absolute;top:0;bottom:0;border-right:1px solid rgba(0,0,0,.25);font-size:10.5px;color:#111;padding:2px 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.seg.part{background:rgba(234,179,8,.75)}
.seg.full{background:rgba(239,68,68,.85);color:#fff}
.seg.busy{background:#9ca3af}
.seg.block{background:repeating-linear-gradient(45deg,#4b5563,#4b5563 5px,#374151 5px,#374151 10px);color:#e5e7eb}
.seg.pend{background:repeating-linear-gradient(45deg,rgba(96,165,250,.55),rgba(96,165,250,.55) 5px,rgba(96,165,250,.25) 5px,rgba(96,165,250,.25) 10px);color:#0b1b33}
.seg.mine{outline:2px solid #fff;outline-offset:-2px}
.strip .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent2);pointer-events:none}
.strip-scale{position:relative;height:16px;font-size:10.5px;color:var(--muted)}
.strip-scale span{position:absolute;transform:translateX(-50%)}
.strip-free{font-size:12px;color:#86efac;text-align:right}
.strip-free.none{color:#fca5a5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}

.rd-hero{background:linear-gradient(135deg,#3b0a10 0%,#1b1e27 55%,#16202f 100%);border:1px solid var(--line);border-radius:16px;padding:20px 24px;margin-bottom:14px}
.rd-hero h2{margin:0 0 4px;font-size:22px}
.rd-hero p{margin:0;color:#c7cbd6}
.rd-ask{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.rd-ask-h{font-weight:700;margin-bottom:10px}
.rd-ask-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rd-ask-tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));cursor:pointer;text-align:left;transition:transform .1s,border-color .15s}
.rd-ask-tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.rd-ask-tile span{font-size:26px;line-height:1.2}
.rd-ask-tile b{font-size:15px}
.rd-ask-tile small{color:var(--muted);font-size:12px}
.rd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px}
.rd-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.rd-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rd-h span{font-size:18px}
.rd-h b{font-size:15px}
.rd-h em{font-style:normal;font-size:12px;font-weight:700;background:var(--panel3);color:var(--muted);padding:1px 8px;border-radius:10px}
.rd-h .btn{margin-left:auto}
.rd-foot{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.rd-foot .btn:only-child{margin-left:auto}
.rd-t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-prod{display:flex;gap:10px;align-items:center;padding:7px 6px;border-radius:10px;cursor:pointer}
.rd-prod:hover{background:var(--panel2)}
.rd-prod.now{background:rgba(239,68,68,.08);box-shadow:inset 0 0 0 1px #7f1d1d}
.rd-prod.past{opacity:.5}
.rd-time{width:48px;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;line-height:1.1}
.rd-time small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.rd-bar{width:4px;align-self:stretch;border-radius:4px}
.rd-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.rd-tag{font-size:11px;padding:1px 7px;border-radius:8px;background:var(--panel3);color:#d1d5db}
.rd-tag[style]{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.rd-tag.live{background:#7f1d1d;color:#fecaca}
.rd-tag.on{background:#14532d;color:#86efac}
.rd-cut{display:flex;gap:10px;align-items:center;padding:7px 4px}
.rd-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#111;flex:none}
.rd-meter{height:6px;border-radius:4px;background:var(--panel3);overflow:hidden;margin:4px 0 2px}
.rd-meter i{display:block;height:100%}
.rd-free{font-size:12px;font-weight:800;padding:3px 9px;border-radius:12px;white-space:nowrap}
.rd-free.ok{background:#14532d;color:#86efac}.rd-free.mid{background:#4d3b05;color:#fde68a}.rd-free.full{background:#4c1414;color:#fca5a5}
.rd-mk{margin-bottom:8px}
.rd-mk-h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.rd-mk-h span{font-size:12px;font-weight:700}
.rd-mk-h span.ok{color:#86efac}.rd-mk-h span.full{color:#fca5a5}
.rd-mk .strip{height:28px}
.rd-mine{display:flex;gap:10px;align-items:center;padding:6px 4px;border-radius:8px;cursor:pointer}
.rd-mine:hover{background:var(--panel2)}
.rd-mine>span:first-child{font-size:18px}
.lr-list{display:flex;flex-direction:column;gap:8px}
.lr-item{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.lr-list.compact .lr-item{background:var(--panel2);padding:8px 10px}
.lr-item:hover{border-color:#4b5563}
.lr-item.rej{opacity:.55}
.lr-item.is-new{outline:2px solid var(--new)}
.lr-date{width:44px;text-align:center;flex:none;background:var(--panel3);border-radius:10px;padding:4px 0}
.lr-date b{display:block;font-size:18px;line-height:1.1}
.lr-date small{font-size:11px;color:var(--muted);text-transform:uppercase}
.lr-main{flex:1;min-width:0}
.lr-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr-main .src{color:#93c5fd;font-weight:600}
.lr-main .mine{color:#86efac;font-weight:700}
.lr-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stages{display:flex;gap:4px;align-items:center;margin-top:6px;flex-wrap:wrap}
.stage{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted)}
.stage i{width:22px;height:5px;border-radius:3px;background:var(--panel3);display:inline-block}
.stage.done i{background:#22c55e}
.stage.cur i{background:#60a5fa;width:28px}
.stage.cur{color:#bfdbfe}
.stage.bad{color:#fca5a5}
@media(max-width:700px){.rd-grid{grid-template-columns:1fr}.lr-item{flex-wrap:wrap}}
/* v0.18 Kamera, Produktion, mehrere Personen */
.wz-people{display:flex;flex-direction:column;gap:6px}
.wz-person{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.wz-person b{min-width:140px}
.wz-person .seg-btn{padding:6px 16px}
.wz-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.wz-row2{grid-template-columns:1fr}}
.cam-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.cam-slot{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.cam-slot b{font-size:14px}
.cam-slot small{font-size:11px;font-weight:700}
.cam-slot.ok{border-color:#166534;background:rgba(34,197,94,.1)}.cam-slot.ok small{color:#86efac}
.cam-slot.full{opacity:.5;cursor:default}.cam-slot.full small{color:#fca5a5}
.ec-meta a{color:#93c5fd}
/* v0.19 Übersicht Produktion, Erinnerungen, Zähler, Hell/Dunkel */
.nav-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#60a5fa;margin-left:auto}
.ndot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#60a5fa;margin-left:6px;vertical-align:1px}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:9px}
.pill.pnew{background:#1e3a5f;color:#93c5fd}.pill.pchg{background:var(--panel3);color:var(--muted)}
.ho-item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--panel2)}
.ho-item.prio{border-color:#ca8a04;background:rgba(234,179,8,.08);box-shadow:inset 3px 0 0 #eab308}
.ho-item.done{opacity:.6}
.ho-top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;font-weight:700;color:#facc15}
.ho-top .muted{font-weight:400}
.ho-text{margin:4px 0 6px;font-size:13.5px}
.ho-acts{display:flex;gap:6px;flex-wrap:wrap}
.ho-new{margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.rem-day{margin-bottom:8px}
.rem-dh{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:6px 0 4px}
.rem-item{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer;border-left:3px solid var(--line)}
.rem-item:hover{background:var(--panel2)}
.rem-item.warn{border-left-color:var(--warn)}.rem-item.hint{border-left-color:var(--bad)}
.rem-time{width:42px;flex:none;font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;color:var(--muted)}
.rem-ic{width:20px;text-align:center}
.rem-t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- Helles Design ---------- */
html[data-theme="light"]{--bg:#f3f4f7;--panel:#ffffff;--panel2:#f5f6f9;--panel3:#e6e8ee;--line:#dde0e7;--text:#1b1f27;--muted:#636b7a;--new:#d97706}
[data-theme="light"] body{color-scheme:light}
[data-theme="light"] .nav-item{color:#3a4150}
[data-theme="light"] .nav-item.active,[data-theme="light"] .tab.active,[data-theme="light"] .chip.on{color:#111}
[data-theme="light"] .chip.on,[data-theme="light"] .pq-card.sel,[data-theme="light"] .ctile.sel,[data-theme="light"] .dtile.sel{border-color:#111}
[data-theme="light"] .hero,[data-theme="light"] .wiz-start,[data-theme="light"] .rd-hero{background:linear-gradient(135deg,#ffe4e6,#ffffff 60%)}
[data-theme="light"] .rd-hero p{color:#4b5563}
[data-theme="light"] .login{background:radial-gradient(circle at 30% 20%,#ffe4e6,var(--bg) 60%)}
[data-theme="light"] .mday.other,[data-theme="light"] .matrix .cell.off,[data-theme="light"] .pcol.backlog{background:#eceef3}
[data-theme="light"] .achip{background:#dbe7fb;color:#1e3a5f}[data-theme="light"] .achip.studio{background:#ece3fb;color:#4c1d95}
[data-theme="light"] .rd-tag{color:#374151}
[data-theme="light"] .warnbox{background:#fffbeb;border-color:#fcd34d;color:#78350f}
[data-theme="light"] .infobox{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}
[data-theme="light"] .okbox{background:#f0fdf4;border-color:#bbf7d0;color:#14532d}
[data-theme="light"] .dupbox{background:#fffbeb;border-color:#fcd34d;color:#78350f}
[data-theme="light"] .hint-red,[data-theme="light"] .btn.danger{color:#dc2626}
[data-theme="light"] .strip-free{color:#15803d}[data-theme="light"] .strip-free.none{color:#dc2626}
[data-theme="light"] .dl-today,[data-theme="light"] .ct-hint,[data-theme="light"] .rb-note{color:#a16207}
[data-theme="light"] .rb-note.bad{color:#b91c1c}
[data-theme="light"] .notif .ch{color:#a16207}
[data-theme="light"] .vp-me,[data-theme="light"] .lr-main .mine,[data-theme="light"] .wz-steps span.done{color:#15803d}
[data-theme="light"] .lr-main .src{color:#1d4ed8}
[data-theme="light"] .stage.cur{color:#1d4ed8}
[data-theme="light"] .iss-wa{color:#14532d;background:#f0fdf4}
[data-theme="light"] .ho-top{color:#a16207}
[data-theme="light"] .form .f.box-live .toggle{color:#b91c1c}
[data-theme="light"] .form .f.box-live{background:linear-gradient(90deg,#fee2e2,#fff5f5)}
[data-theme="light"] .badge.ok,[data-theme="light"] .tchip.ok,[data-theme="light"] .seg-btn.on,[data-theme="light"] .rd-free.ok,[data-theme="light"] .rchip.cuba.free,[data-theme="light"] .rd-tag.on{background:#dcfce7;color:#166534}
[data-theme="light"] .badge.warn,[data-theme="light"] .tchip.part,[data-theme="light"] .rd-free.mid,[data-theme="light"] .rchip.cuba.plus,[data-theme="light"] .seg-btn.on[data-v="Plus"]{background:#fef3c7;color:#92400e}
[data-theme="light"] .badge.bad,[data-theme="light"] .rd-free.full{background:#fee2e2;color:#991b1b}
[data-theme="light"] .badge.info,[data-theme="light"] .rchip.srt,[data-theme="light"] .rchip.player,[data-theme="light"] .pill.pnew{background:#dbeafe;color:#1e40af}
[data-theme="light"] .rchip.live,[data-theme="light"] .rd-tag.live{background:#fee2e2;color:#b91c1c}
[data-theme="light"] .rchip.test{background:#f3e8ff;color:#6b21a8}
[data-theme="light"] .rchip.rec{background:#cffafe;color:#155e75}
[data-theme="light"] .tick.on{background:#dbeafe;border-color:#60a5fa}
[data-theme="light"] .ev{box-shadow:0 1px 2px rgba(0,0,0,.15)}
[data-theme="light"] .modal-layer{background:rgba(15,23,42,.35)}
[data-theme="light"] .modal,[data-theme="light"] .bell-panel,[data-theme="light"] .toast{box-shadow:0 12px 40px rgba(15,23,42,.18)}
[data-theme="light"] [style*="color:#86efac"]{color:#15803d!important}
[data-theme="light"] [style*="color:#fca5a5"]{color:#b91c1c!important}
[data-theme="light"] [style*="color:#fde68a"]{color:#a16207!important}
[data-theme="light"] [style*="color:#93c5fd"],[data-theme="light"] [style*="color:#bfdbfe"]{color:#1d4ed8!important}
[data-theme="light"] .t tr.is-new td{background:rgba(245,158,11,.08)}
[data-theme="light"] .tg-col.today{background-color:rgba(227,6,19,.04)}
/* v0.20 Widgets, Dienstzeiten, Verfügbarkeit */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;grid-auto-flow:row dense}
.wgt{min-width:0;display:flex;flex-direction:column}
.wgt.w{grid-column:span 2}.wgt.f{grid-column:1/-1}
@media(max-width:820px){.wgt.w{grid-column:auto}}
.wgt-body{flex:1;display:flex;flex-direction:column}
.wgt-body>.card,.wgt-body>.rd-card{flex:1;margin:0!important}
.wgt-body>.card.vp-wide{grid-column:auto}
.wgrid.editing .wgt{outline:2px dashed var(--line);outline-offset:3px;border-radius:12px}
.wgrid.editing .wgt-body{pointer-events:none;opacity:.8}
.wgt-bar{display:flex;align-items:center;gap:4px;padding:4px 6px;margin-bottom:6px;background:var(--panel3);border-radius:8px;cursor:grab;font-size:13px}
.wgt-grip{font-size:16px;color:var(--muted);padding:0 4px}
.wgt.dragging{opacity:.35}
.wgt.drop-before{box-shadow:-4px 0 0 var(--accent)}.wgt.drop-after{box-shadow:4px 0 0 var(--accent)}
.wpick{display:flex;flex-direction:column;gap:6px}
.wpick-item{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.wpick-item:hover{border-color:var(--accent)}
.wpick-item span{font-size:22px}.wpick-item small{display:block;color:var(--muted);font-size:12px}
.od-scale{display:grid;grid-template-columns:130px 1fr;font-size:10.5px;color:var(--muted)}
.od-scale>div{position:relative;height:14px}.od-scale>div span{position:absolute;transform:translateX(-50%)}
.od-grp{font-size:11.5px;font-weight:800;color:var(--muted);margin:8px 0 2px}
.od-row{display:grid;grid-template-columns:130px 1fr;gap:6px;align-items:center;padding:2px 0;border-radius:6px}
.od-row.click{cursor:pointer}.od-row.click:hover{background:var(--panel2)}
.od-name{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.od-name small{color:var(--muted)}.od-name.now{font-weight:800}
.od-track{position:relative;height:20px;background:var(--panel2);border-radius:5px}
.od-bar{position:absolute;top:2px;bottom:2px;border-radius:4px;font-style:normal;font-size:10.5px;font-weight:700;color:#111;padding:0 5px;white-space:nowrap;overflow:hidden;line-height:16px}
.od-bar.cut{background:#93c5fd}.od-bar.cam{background:#fdba74}.od-bar.vp{background:#c4b5fd}.od-bar.mk{background:#f9a8d4}
.od-bar.custom{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.45) 0 4px,transparent 4px 8px);outline:1.5px dashed #111}
.od-now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent2)}
.od-note{font-size:11.5px;color:var(--muted);margin:0 0 2px 136px}
.t tr.urgent td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
.av-palette{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.av-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;user-select:none}
.av-h{font-size:11px;color:var(--muted);text-align:center;font-weight:700}
.av-day{position:relative;min-height:54px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--panel2);cursor:pointer;display:flex;flex-direction:column}
.av-day b{font-size:12px}.av-day span{font-size:16px;font-weight:800;text-align:center;margin-top:2px}
.av-day.we{background:var(--panel)}.av-day.past{opacity:.45}
.av-day.v-ja{background:rgba(34,197,94,.22);border-color:#16a34a}
.av-day.v-nein{background:rgba(239,68,68,.18);border-color:#b91c1c}
.av-day.v-code{background:rgba(96,165,250,.22);border-color:#3b82f6}
.av-day .av-sh{font-style:normal;font-size:10px;font-weight:800;background:#111;color:#fff;border-radius:4px;padding:0 4px;align-self:flex-start;margin-top:auto}
.av-sum{font-size:12px;color:var(--muted);margin-top:8px}
.av-status{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pl-grid{display:grid;min-width:max-content}
.pl-grid>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.pl-h{font-size:10.5px;text-align:center;padding:4px 0;background:var(--panel2);color:var(--muted);position:sticky;top:0}
.pl-h b{color:var(--text);font-size:12px}.pl-h.we{background:var(--panel3)}.pl-h.today{color:var(--accent2)}
.pl-who{padding:5px 8px;cursor:pointer;position:sticky;left:0;background:var(--panel);z-index:1}
.pl-who small{display:block;color:var(--muted);font-size:11px}.pl-who:hover{background:var(--panel2)}
.pl-c{min-height:38px;display:grid;place-items:center;cursor:pointer;font-size:11px}
.pl-c:hover{outline:2px solid var(--muted);outline-offset:-2px}
.pl-c.a-ja{background:rgba(34,197,94,.22)}.pl-c.a-no{background:rgba(239,68,68,.18);color:#fca5a5}.pl-c.a-code{background:rgba(96,165,250,.22)}
.pl-c.as b{background:#111;color:#fff;border-radius:5px;padding:1px 5px;font-size:11px}
.pl-c.bad{outline:2px solid var(--bad);outline-offset:-2px}
.pl-c.foot{cursor:default;font-weight:800;font-size:11px}.pl-c.foot.ok{color:#86efac}.pl-c.foot.miss{color:#fca5a5}
[data-theme="light"] .pl-c.as b,[data-theme="light"] .av-day .av-sh{background:#1f2937}
[data-theme="light"] .pl-c.a-no{color:#b91c1c}[data-theme="light"] .pl-c.foot.ok{color:#15803d}[data-theme="light"] .pl-c.foot.miss{color:#b91c1c}
/* v0.23 Signalwege, automatische Live-Status, Studio-Alternativen & Redaktionskalender */
.alt-times{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.alt-times .chip{background:rgba(34,197,94,.1);border-color:#166534;color:#86efac}
.player-top{border-color:#1d4ed8!important;background:rgba(37,99,235,.08)!important}
.player-top label{color:#93c5fd!important;font-weight:700}
/* v0.22 kompakte Streaming-Unterbereiche, Werbestandards & Cutter-Fristen */
.stream-section{min-width:220px;font-weight:700}
.ad-standard-note{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.25);margin:8px 0}
.deadline-people{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px;margin:8px 0 12px}
.deadline-person{display:flex;gap:8px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.deadline-person small{display:block;color:var(--muted)}
/* v0.21 kleinere, scrollbare Widgets & Werbung */
.wgrid.density-compact{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.wgrid.density-small{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.wgrid.density-compact .wgt-body>.card,.wgrid.density-compact .wgt-body>.rd-card{max-height:320px;overflow:auto;scrollbar-gutter:stable}
.wgrid.density-small .wgt-body>.card,.wgrid.density-small .wgt-body>.rd-card{max-height:235px;overflow:auto;scrollbar-gutter:stable;padding:9px 10px;border-radius:9px}
.wgrid.density-small .card h3{font-size:12.5px;margin-bottom:6px}.wgrid.density-small .list-row{padding:4px 2px;gap:6px;font-size:12px}
.wgrid.density-small .list-row .time{width:70px;font-size:11px}.wgrid.density-small .list-row .sub,.wgrid.density-small .sub{font-size:11px}
.wgrid.density-small .kpi{min-width:112px;padding:8px 10px}.wgrid.density-small .kpi b{font-size:19px}
.wgrid.density-small .rd-prod,.wgrid.density-small .rd-cut,.wgrid.density-small .rd-mine{padding:4px 3px}
.density-ctl .seg-btn{padding:5px 9px;font-size:11.5px}
.ad-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:12px}
.ad-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.ad-card.attn{border-color:var(--new)}.ad-card.done{border-color:#166534}
.ad-head{display:flex;gap:10px;align-items:flex-start}.ad-date{width:54px;flex:none;text-align:center;background:var(--panel2);border-radius:9px;padding:5px}
.ad-date b{display:block;font-size:18px}.ad-date small{color:var(--muted);font-size:10.5px;text-transform:uppercase}
.ad-main{flex:1;min-width:0}.ad-title{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-stages{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.ad-stage{font-size:10.5px;color:var(--muted);border-top:3px solid var(--line);padding-top:3px}
.ad-stage.done{border-color:var(--ok);color:#86efac}.ad-stage.open{border-color:var(--warn);color:#fde68a}
.ad-section{background:var(--panel2);border-radius:8px;padding:8px 9px}.ad-section h4{margin:0 0 5px;font-size:12px}
.ad-task{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:5px 0;font-size:12px}.ad-task:first-of-type{border-top:0}
.ad-task .grow{flex:1;min-width:0}.ad-task.done{opacity:.62}.ad-link{color:#93c5fd;text-decoration:none;font-weight:700}
.ad-link:hover{text-decoration:underline}.ad-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}.ad-progress{height:6px;border-radius:4px;background:var(--panel3);overflow:hidden}
.ad-progress i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#22c55e)}
.ad-lf-row{display:grid;grid-template-columns:70px 1.3fr 2fr 36px 30px;gap:6px;align-items:center;margin-top:6px}
.biz-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.biz-step{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px}
.biz-step b{display:block;font-size:18px}.biz-step small{color:var(--muted)}
@media(max-width:760px){.ad-grid{grid-template-columns:1fr}.ad-lf-row{grid-template-columns:62px 1fr}.ad-lf-row .lf-url{grid-column:1/-1}.biz-flow{grid-template-columns:1fr 1fr}}
[data-theme="light"] .ad-stage.done{color:#15803d}[data-theme="light"] .ad-stage.open{color:#a16207}[data-theme="light"] .ad-link{color:#1d4ed8}

</style>
</head>
<body>
<div id="login" class="login hidden"></div>
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><span class="logo">PH</span><div><b>Production Hub</b><small>Production Management</small></div></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot" id="sidefoot"></div>
  </aside>
  <section class="content">
    <header class="topbar">
      <h1 id="title"></h1>
      <div class="top-right">
        <button class="icon-btn" id="themeBtn" data-act="theme" title="Helles Design">☀️</button>
        <button class="icon-btn" data-act="bell" title="Benachrichtigungen"><span>🔔</span><i id="bellCount" class="dot hidden"></i></button>
        <div class="user-chip" data-act="switchUser" title="Benutzer wechseln"><span id="userName"></span><em id="userRole"></em></div>
      </div>
    </header>
    <main id="main"></main>
  </section>
</div>
<div id="bellPanel" class="bell-panel hidden"></div>
<div id="modalLayer" class="modal-layer hidden"></div>
<div id="confirmLayer" class="modal-layer hidden"></div>

<script>
/* =========================================================================
   Production Hub – Prototyp v0.24
   Studio · Streaming · Maske · Personal · Equipment · Anfragen der Redaktion
   Daten liegen lokal (localStorage, mit Fallback für SharePoint-Vorschau).
   Die Datenschicht ist in "Store" gekapselt, damit später ein Server/
   SharePoint-Backend angebunden werden kann.
   ========================================================================= */
'use strict';

/* ---------- Utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return toISO(d); };
const WD = ['So.', 'Mo.', 'Di.', 'Mi.', 'Do.', 'Fr.', 'Sa.'];
const WDL = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const wd = s => WD[parseISO(s).getDay()];
const fmtDate = s => s ? `${s.slice(8, 10)}.${s.slice(5, 7)}.${s.slice(0, 4)}` : '';
const fmtShort = s => s ? `${wd(s)} ${s.slice(8, 10)}.${s.slice(5, 7)}.` : '';
const tmin = t => { if (!t) return null; const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
const mint = m => `${pad(Math.floor(((m % 1440) + 1440) % 1440 / 60))}:${pad(((m % 60) + 60) % 60)}`;
const startOfWeek = s => { const d = parseISO(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return toISO(d); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTs = ts => { const d = new Date(ts); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}. ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const initials = n => String(n).split(/[\s,]+/).filter(Boolean).map(x => x[0]).slice(0, 2).join('').toUpperCase();
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const today = () => toISO(new Date());
const overlap = (a1, a2, b1, b2) => a1 < b2 && b1 < a2;
const endMin = (s, e) => { const a = tmin(s), b = tmin(e); if (b == null) return a + 60; return b <= a ? b + 1440 : b; };

/* ---------- Konstanten ---------- */
const MK_LOCS = ['7.OG – WELT Maske', '3.OG – Studiofläche'];
const MK_KINDS = ['Puder & Haar-Fix', 'Make-up & Hair', 'Reduziertes Make-up', 'Touch-up', 'Sonstiges'];
const REQ_TYPES = ['Maske', 'Studio', 'Studio + Maske'];
const REQ_STATUS = ['Offen', 'Bestätigt', 'Abgelehnt'];
const REQ_CLS = { 'Offen': 'warn', 'Bestätigt': 'ok', 'Abgelehnt': 'bad' };
const MK_DEFAULTS = { Herr: 30, Dame: 60, buffer: 10, capacity: 2, open: '08:00', close: '20:00' };
const BOOKING_TYPES = ['Produktion', 'Dreh', 'Blocker', 'Block', 'Wartung'];
const BLOCKING = ['Blocker', 'Block', 'Wartung'];
const isBlock = t => BLOCKING.includes(t);

const STOP = new Set('der die das und oder mit von für fuer zu zum zur im in am an auf aus bei ein eine einen einem eines dem den des ist sind bitte schnitt beitrag video clip neu neue neuer neues fertig version kurz mal noch auch als vom über ueber nach vor'.split(' '));

    ...db.bookings.filter(b => b.live && b.cubaId && !isBlock(b.type) && b.status !== 'Abgesagt').map(b => ({ kind: 'booking', id: b.id, cubaId: b.cubaId, name: b.title, date: b.date, start: b.allDay ? 'ganztägig' : b.start, end: b.allDay ? '' : b.end, span: bookingSpan(b), link: b.streamId })),
  ];

/* Wer nutzt die CUBA zur gleichen Zeit? Ein Studio-Termin und sein verknüpfter Stream zählen als eins. */

    && overlap(span[0], span[1], u.span[0], u.span[1]))

function reminders(D, days = 7) {

  db.streams.filter(s => s.kind === 'Hinweistag').forEach(s => add(s.date, '', '⚠️', s.name, s.notes || 'Hinweistag', 'streams', s.id, 'hint'));
  upcomingTests().forEach(t => add(t.date, t.start, '🧪', `Test: ${t.st.name}`, `${t.note || 'Leitungstest'}${t.st.provider ? ' · ' + t.st.provider : ''}`, 'streams', t.st.id));
  db.bookings.filter(b => b.type === 'Dreh' && b.status !== 'Abgesagt').forEach(b => add(b.date, b.allDay ? '' : b.start, '🎥', `Dreh: ${b.title}`, `${studioById(b.studioId).name}${b.producer ? ' · ' + b.producer : ''}${(b.crew || []).length ? ' · Crew: ' + displayVal(b, { key: 'crew', type: 'staffmulti' }) : ' · ⚠️ noch keine Crew'}`, 'bookings', b.id, (b.crew || []).length ? '' : 'warn'));
  db.assignments.filter(a => a.role === 'Tageskamera' && a.status !== 'Abgesagt').forEach(a => add(a.date, a.start, '🎥', `Tageskamera: ${(staffById(a.staffId) || {}).name || ''}`, `${a.production}${a.location ? ' · ' + a.location : ''}`, 'assignments', a.id));
  db.streams.filter(s => isEvent(s) && !techStatus(s).sig).forEach(s => add(s.date, s.start, '📡', `Signalweg offen: ${s.name}`, 'Zuführung / DEC noch nicht festgelegt', 'streams', s.id, 'warn'));
  db.bookings.filter(b => b.live && !b.cubaId && !isBlock(b.type) && b.status !== 'Abgesagt').forEach(b => add(b.date, b.start, '🔴', `Live ohne CUBA: ${b.title}`, studioById(b.studioId).name, 'bookings', b.id, 'warn'));
  db.edits.filter(e => isActiveEdit(e) && e.deadline).forEach(e => add(e.deadline, e.deadlineTime, '✂️', `Abgabe: ${e.title}`, `${e.staffId ? (staffById(e.staffId) || {}).name || '' : '⚠️ noch kein Cutter'} · ${e.status}`, 'edits', e.id, e.staffId ? '' : 'warn'));
  hoList().filter(h => h.date > today()).forEach(h => add(h.date, '', '📝', h.text.length > 70 ? h.text.slice(0, 67) + '…' : h.text, `Notiz von ${userName(h.by)}`, '', h.id));
  return out.sort((a, b) => (a.date + (a.time || '00:00')).localeCompare(b.date + (b.time || '00:00')));
}

    if (!(await askConfirm(`Dienstplan ${monthLabel(d.m)} veröffentlichen?${clash ? `\n\n⚠️ ${clash} Schicht(en) liegen auf Tagen, die als „nicht verfügbar“ gemeldet sind.` : ''}\n\nDie Freien sehen ihre Schichten danach in „Meine Verfügbarkeit“ und bekommen eine Benachrichtigung.`))) return;
    db.post.published = { ...(db.post.published || {}), [d.m]: Date.now() };
    people.forEach(p => { let r = availRec(p.id, d.m); if (!r) { availPaint(p.id, d.m, monthDays(d.m)[0], ''); r = availRec(p.id, d.m); } logActivity('avail', r, `Dienstplan ${monthLabel(d.m)} veröffentlicht`, []); });
    persist(); toast(`📢 Dienstplan ${monthLabel(d.m)} veröffentlicht`, 'ok'); render();
  },
  avRemind: d => availDeadlineDialog(d.m, true),
});

/* ---------- Start ---------- */
(function init() {
  loadDb();
  const ui = loadUi();
  applyTheme();
  const u = ui.user && db.users.find(x => x.id === ui.user);
  if (u) { me = u; $('#app').classList.remove('hidden'); render(); greet(); } else showLogin();
})();

</script>
</body>
