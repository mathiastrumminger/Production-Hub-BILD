name: Docker Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-hub-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: azure/setup-helm@v4
      - name: Verify application and chart
        run: |
          npm test
          npm run build
          helm lint helm
          test "$(cat VERSION)" = "$(node -p 'require("./package.json").version')"
          test "$(cat VERSION)" = "$(awk '/^version:/ {print $2}' helm/Chart.yaml)"
      - uses: docker/setup-buildx-action@v3
      - name: Image coordinates
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: production-hub:test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check actual container with PRD security settings
        run: |
          set -euo pipefail
          docker run -d --name production-hub-test --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:4174:8080 production-hub:test
          trap 'docker logs production-hub-test; docker rm -f production-hub-test' EXIT
          curl --retry 15 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:4174/healthz
          for path in index.html src/app.js src/styles.css vendor/jszip.min.js; do
            curl --fail --silent "http://127.0.0.1:4174/$path" | cmp "dist/site/$path" -
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4174/missing.js)" = 404
          curl -sI http://127.0.0.1:4174/index.html | grep -qi 'cache-control: no-cache'
      - name: Publish private image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          docker tag production-hub:test "$IMAGE:$VERSION"
          docker tag production-hub:test "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$REVISION"
